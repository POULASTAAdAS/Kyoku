syntax = "proto3";

package playlist;

option java_multiple_files = true;
option java_package = "com.poulastaa.kyoku.playlist.grpc";

message RequestSong{
  int64 songId = 1;
};

message RequestPlaylist{
  int64 playlistId = 1;
  string name = 2;
  repeated RequestSong songs = 3;
};

message ResponseEmpty{};

service CreatePlaylistService{
  rpc createPlaylist(RequestPlaylist) returns (ResponseEmpty);
}