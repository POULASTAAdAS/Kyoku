syntax = "proto3";
import "model.proto";

option java_multiple_files = true;
option java_package = "com.poulastaa.kyoku.grpc.playlist_user";

package playlistUser;

message RequestUserId{
  model.RequestUser user = 1;
};

message ResponseUserId{
  int64 userId = 1;
};

service PlaylistUserService{
  rpc getUserId(RequestUserId) returns (ResponseUserId);
}
