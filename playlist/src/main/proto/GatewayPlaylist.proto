syntax = "proto3";
import "model.proto";

option java_multiple_files = true;
option java_package = "com.poulastaa.kyoku.grpc.gateway_playlist";

package gatewayPlaylist;

message RequestUserPlaylists{
  model.RequestUser user = 1;
};

message RequestImportPlaylist{
  string spotifyPlaylistId = 1;
  model.RequestUser user = 2;
  bool force = 3; // re-import even if the user already imported this spotify playlist
};

// response
message ResponsePlaylist{
  int64 playlistId = 1;
  string name = 2;
  int64 popularity = 3;
  ResponsePlaylistVisibilityState status = 4;
  optional string spotifyPlaylistId = 5;

  enum ResponsePlaylistVisibilityState{
    PUBLIC = 0;
    PRIVATE = 1;
  };
};

message ResponseSong{
  int64 songId = 1;
  string title = 2;
  optional string poster = 3;
  model.SongInfo info = 4;
  repeated model.Artist artists = 5;
  repeated model.Genre genre = 6;
  repeated model.Country country = 7;
  repeated model.Album albums = 8;
};

message ResponseFullPlaylist{
  ResponsePlaylist playlist = 1;
  repeated ResponseSong songs = 2;
};

message ResponseUserPlaylists{
  repeated ResponseFullPlaylist playlists = 1;
};

service GatewayPlaylistService{
  rpc importPlaylist(RequestImportPlaylist) returns (ResponseFullPlaylist);
  rpc getUserPlaylists(RequestUserPlaylists) returns (ResponseUserPlaylists);
}
