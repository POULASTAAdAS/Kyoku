logging:
  level:
    root: warn
    com.poulastaa: warn

spring:
  application:
    name: ${user-service.name:user}
    version: ${user-service.version:1.0.0}

  config:
    name: ${discovery.name:discovery}
    import: optional:configserver:http://kyoku-gateway.poulastaa.dev:1200
  profiles:
    active: dev

  cloud:
    config: # --------------------------------- CONFIG-SERVER ---------------------------------
      uri: http://kyoku-gateway.poulastaa.dev:1200
      username: admin
      password: configServer101$@
      profile: dev
      label: main
      fail-fast: true

      retry:
        initial-interval: 1000
        multiplier: 1.6
        max-attempts: 4
        max-interval: 2000

      request-connect-timeout: 5000
      request-read-timeout: 5000

  mvc:
    log-request-details: true
  output:
    ansi:
      enabled: detect

  devtools:
    livereload:
      enabled: true
      port: ${user-service.livereload-port:8087}

  datasource: # -------------------------- SQL --------------------------
    user:
      url: ${sql.user}
    playlist:
      url: ${sql.playlist}

  jpa:
    show-sql: ${sql.show-sql}
    database: ${sql.database}
    hibernate:
      ddl-auto: ${sql.ddl-auto}
      naming:
        physical-strategy: ${sql.physical-strategy}

grpc:
  server:
    port: ${user-service.grpc.port:8086}
    reflection-service-enabled: true

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${eureka.url}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    metadata-map:
      grpc.port: ${user-service.grpc.port:8086}