logging:
  level:
    com.poulastaa: info
    root: warn

config-server:
  url: http://localhost:8888

discovery-server:
  url: http://localhost:8001/eureka/

spring:
  application:
    name: ${user-service.name:user}
    version: ${user-service.version:1.0.0}

  profiles:
    active: dev

  config:
    import: configserver:${config-server.url}

  cloud:
    config:
      name: ${user-service.name:user}
      uri: ${config-server.url}
      username: admin
      password: configServer101$@
      profile: dev
      label: main
      fail-fast: true

      retry:
        initial-interval: 1000
        multiplier: 1.6
        max-attempts: 4
        max-interval: 2000

      request-connect-timeout: 5000
      request-read-timeout: 5000

  mvc:
    log-request-details: ${debug:true}

  output:
    ansi:
      enabled: ${log.ansi:detect}

  devtools:
    restart:
      enabled: ${restart:true}
    add-properties: ${livereload.add-properties:true}
    livereload:
      enabled: ${livereload.enabled:true}
      port: ${user-service.livereload-port:8087}

  datasource: # -------------------------- SQL --------------------------
    user:
      url: ${sql.user}
    playlist:
      url: ${sql.playlist}

  jpa:
    show-sql: ${sql.show-sql}
    database: ${sql.database}
    hibernate:
      ddl-auto: ${sql.ddl-auto}
      naming:
        physical-strategy: ${sql.physical-strategy}

grpc:
  server:
    port: ${user-service.grpc.port:8086}
    reflection-service-enabled: true

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${eureka.url:${discovery-server.url}}
    register-with-eureka: ${eureka.register-with-eureka:true}
    fetch-registry: ${eureka.fetch-registry:true}
  instance:
    prefer-ip-address: true
    metadata-map:
      grpc.port: ${user-service.grpc.port:8086}
      version: ${user-service.version:1.0.0}
