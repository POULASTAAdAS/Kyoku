syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.poulastaa.kyoku.grpc.playlistUser";

package playlistUser;

message RequestUser{
  string email = 1;
  UserType type = 2;

  enum UserType{
    DEFAULT = 0;
    EMAIL = 1;
    GOOGLE = 2;
  }
};

message RequestUserId{
  RequestUser user = 1;
};

message ResponseUserId{
  int64 userId = 1;
};

service PlaylistUserService{
  rpc getUserId(RequestUserId) returns (ResponseUserId);
}
