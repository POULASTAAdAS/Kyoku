syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.poulastaa.kyoku.grpc.playlistUser";

package playlistUser;

enum RequestPlaylistVisibilityType{
  UNDEFINED = 0;
  PRIVATE = 1;
  PUBLIC = 2;
}

message RequestSaveUserPlaylist{
  int64 userId = 1;
  int64 playlistId = 2;
  RequestPlaylistVisibilityType type = 3;
};

message EmptyResponse{};

service  PlaylistUserService{
  rpc saveUserPlaylist(RequestSaveUserPlaylist) returns (EmptyResponse);
}