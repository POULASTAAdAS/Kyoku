syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.poulastaa.kyoku.grpc.gateway_song";

package gatewaySong;

message RequestSongStreamUrl{
  int64 songId = 1;
  string email = 2;
};

message ResponseSongStreamUrl{
  string url = 1;
  int64 expiresAtSec = 2;
};

service GatewaySongService{
  rpc getStreamUrl(RequestSongStreamUrl) returns (ResponseSongStreamUrl);
}
