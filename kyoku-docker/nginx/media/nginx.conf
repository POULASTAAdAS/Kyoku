# Main config for kyoku-media-nginx: stock nginx:1.27-alpine nginx.conf plus the njs module
# (load_module is main-context only, so it cannot live in conf.d / templates) and the
# MEDIA_TOKEN_SECRET env passthrough read by njs/media_auth.js via process.env.

load_module modules/ngx_http_js_module.so;

env MEDIA_TOKEN_SECRET;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
