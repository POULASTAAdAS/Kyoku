syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.poulastaa.kyoku.grpc.model";

package activity_model;

message RequestSaveUserGenre{
  int64 userId = 1;
  repeated int32 genreList = 2;
};

message RequestSaveUserArtist{
  int64 userId = 1;
  repeated int64 artistIdList = 2;
}

message EmptyResponse{};